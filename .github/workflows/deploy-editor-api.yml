name: Deploy wiki editor API

on:
  push:
    branches: [v5]
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-editor-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-editor-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/v5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run editor:test
      - run: npm run editor:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production editor branch
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          const response = await fetch("https://edit.crdg.xyz/api/health", { signal: AbortSignal.timeout(30_000) })
          assert.ok(response.ok, `Editor health: HTTP ${response.status}`)
          const health = await response.json()
          assert.equal(health.githubBaseBranch, "v5")
          assert.equal(health.githubConfigured, true)
          assert.equal(health.turnstileConfigured, true)
          JS
